<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa - Panel Absensi Global</title>
    
    <style>
        :root {
            --primary: #dc2626;         
            --primary-hover: #b91c1c;   
            --primary-light: #fef2f2;   
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --danger-bg: rgba(254, 242, 242, 0.8);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 16px 32px 0 rgba(220, 38, 38, 0.08);
            --card-radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #fef2f2 0%, #f8fafc 50%, #fee2e2 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
        }

        .container { 
            width: 100%; 
            max-width: 800px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(14px); 
            -webkit-backdrop-filter: blur(14px);
            padding: 35px; 
            border-radius: var(--card-radius); 
            box-shadow: var(--glass-shadow); 
            border: 1px solid var(--glass-border);
        }

        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid rgba(220, 38, 38, 0.1); padding-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { font-size: 1.5rem; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 10px; }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.2); padding: 8px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
        .btn-edit-profile { background: var(--primary-light); color: var(--primary); border: 1px solid rgba(220, 38, 38, 0.2); padding: 8px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }

        .profile-card { background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 16px; border: 1px solid rgba(220, 38, 38, 0.1); display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        .student-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: var(--primary); flex-shrink: 0; }
        
        .student-info h2 { font-size: 1.2rem; color: var(--text-main); margin-bottom: 4px; }
        .student-info p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px; }

        .session-alert { 
            font-size: 0.9rem; 
            padding: 16px 20px; 
            border-radius: 14px; 
            margin-bottom: 20px; 
            font-weight: 600; 
            text-align: center; 
            display: none; 
            background: rgba(254, 226, 226, 0.7); 
            backdrop-filter: blur(10px); 
            color: #991b1b; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .session-info-banner {
            font-size: 0.88rem;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            background: rgba(236, 253, 245, 0.8);
            border: 1px solid rgba(5, 150, 105, 0.3);
            color: #047857;
            backdrop-filter: blur(10px);
        }

        .card { background: rgba(255, 255, 255, 0.8); padding: 24px; border-radius: 16px; border: 1px solid rgba(220, 38, 38, 0.1); margin-bottom: 25px; }
        .card h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 15px; font-weight: 700; }

        .status-display { text-align: center; padding: 20px; border-radius: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; margin-bottom: 20px; }
        .status-display .status-val { font-size: 1.3rem; font-weight: 800; margin-top: 5px; color: var(--text-muted); }
        .status-display .status-val.Hadir { color: var(--success); }
        .status-display .status-val.Izin { color: var(--warning); }
        .status-display .status-val.Sakit { color: var(--danger); }
        .status-display .status-val.Alpha { color: #4b5563; }

        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-group select, .form-group textarea, .form-group input { width: 100%; padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 0.9rem; outline: none; background: #fff; }
        .form-group input:disabled { background: #f3f4f6; color: #6b7280; cursor: not-allowed; }
        .form-group textarea { resize: vertical; height: 90px; }

        .info-box { font-size: 0.85rem; padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #fff; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: var(--primary); margin-bottom: 20px; font-size: 1.25rem; font-weight: 700; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #e5e7eb; color: var(--text-main); border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-secondary:hover { background: #d1d5db; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <h1>🎓 Dashboard Siswa</h1>
            <div class="header-actions">
                <button class="btn-edit-profile" onclick="openEditModal()">✏️ Ubah Profil</button>
                <button class="btn-logout" onclick="studentLogout()">Keluar</button>
            </div>
        </div>

        <div class="profile-card">
            <div id="studentAvatarContainer"></div>
            <div class="student-info">
                <h2 id="studentNameDisplay">Memuat...</h2>
                <p>User ID: <span id="studentIdDisplay">-</span></p>
                <p>No. Telepon: <span id="studentPhoneDisplay">-</span></p>
            </div>
        </div>

        <div id="sessionInfoBanner" class="session-info-banner">⏱️ Memuat status waktu sesi...</div>
        <div id="sessionClosedAlert" class="session-alert"></div>

        <div class="card">
            <h3>📌 Status Kehadiran Hari Ini</h3>
            <div class="status-display">
                <span style="font-size: 0.85rem; color: var(--text-muted);">Keterangan Anda Saat Ini:</span>
                <div id="currentStatusVal" class="status-val">-</div>
                <div id="requestStatusInfo" style="font-size: 0.8rem; margin-top: 8px;"></div>
            </div>
            <button id="btnAbsenHadir" class="btn" onclick="submitHadir()">✅ Absen Hadir Sekarang</button>
        </div>

        <div class="card">
            <h3>✉️ Ajukan Izin / Sakit</h3>
            <div class="info-box">Formulir ini hanya dapat dikirimkan **1 kali** sehari jika Anda berhalangan hadir.</div>
            <div class="form-group">
                <label>Jenis Keterangan:</label>
                <select id="reqType">
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>
            <div class="form-group">
                <label>Alasan / Keterangan:</label>
                <textarea id="reqReason" placeholder="Tuliskan alasan lengkap..."></textarea>
            </div>
            <button id="btnKirimRequest" class="btn" onclick="submitRequest()" style="background-color: var(--warning);">Kirim Pengajuan</button>
        </div>
    </div>

    <div id="editProfileModal" class="modal-overlay">
        <div class="modal-content">
            <h3>✏️ Ubah Profil, Foto & Password</h3>
            <div class="form-group"><label>Nama Lengkap (Terkunci):</label><input type="text" id="editName" disabled></div>
            <div class="form-group"><label>User ID / NIS (Terkunci):</label><input type="text" id="editUserId" disabled></div>
            <div class="form-group"><label>Password Baru:</label><input type="password" id="editPassword" placeholder="Password baru..."></div>
            <div class="form-group"><label>No. Telepon / WhatsApp:</label><input type="text" id="editPhone" placeholder="No. Telepon..."></div>
            <div class="form-group"><label>Ubah Foto Profil:</label><input type="file" id="editPhotoFile" accept="image/*"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeEditModal()">Batal</button>
                <button class="btn" onclick="saveProfileChanges()">Simpan</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBABI21WSzwx0uVln_SkLlHrLWuUgJyclQ",
            authDomain: "absen-pemain.firebaseapp.com",
            projectId: "absen-pemain",
            storageBucket: "absen-pemain.firebasestorage.app",
            messagingSenderId: "714361263502",
            appId: "1:714361263502:web:ab6fc668eb4d2b09b680df",
            measurementId: "G-RF6G474HSY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let loggedInUser = JSON.parse(localStorage.getItem('loggedInStudent'));
        if (!loggedInUser) { window.location.href = 'index.html'; }

        window.studentLogout = function() {
            localStorage.removeItem('loggedInStudent');
            window.location.href = 'index.html';
        };

        const todayObj = new Date();
        const currentDateStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

        let sessionDataCache = { isOpen: true, startTime: '06:00', endTime: '09:00' };

        async function initStudentData() {
            try {
                let userId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username;
                let docRef = doc(db, "siswa", String(userId));
                let docSnap = await getDoc(docRef);
                if (docSnap.exists()) loggedInUser = docSnap.data();
            } catch (e) { console.error("Gagal sinkronisasi data cloud:", e); }

            let name = loggedInUser.name || loggedInUser.nama || 'Siswa';
            let userId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username || '-';
            let phone = loggedInUser.phone || '-';
            let photo = loggedInUser.photo || '';

            document.getElementById('studentNameDisplay').innerText = name;
            document.getElementById('studentIdDisplay').innerText = userId;
            document.getElementById('studentPhoneDisplay').innerText = phone;

            const avatarContainer = document.getElementById('studentAvatarContainer');
            avatarContainer.innerHTML = photo ? `<img src="${photo}" class="student-avatar">` : `<div class="student-avatar">${name.charAt(0).toUpperCase()}</div>`;
            
            await fetchSessionAndCheck();
            await checkTodayAttendance();
        }
        initStudentData();

        async function fetchSessionAndCheck() {
            try {
                let sessionRef = doc(db, "attendanceSessions", currentDateStr);
                let sessionSnap = await getDoc(sessionRef);

                if (sessionSnap.exists()) {
                    sessionDataCache.isOpen = sessionSnap.data().isOpen ?? true;
                    sessionDataCache.startTime = sessionSnap.data().startTime || '06:00';
                    sessionDataCache.endTime = sessionSnap.data().endTime || '09:00';
                }

                updateSessionAndTimerUI();
            } catch (e) { console.error("Gagal mengambil status sesi:", e); }
        }

        setInterval(fetchSessionAndCheck, 30000);

        function updateSessionAndTimerUI() {
            let now = new Date();
            let currentTimeMinutes = now.getHours() * 60 + now.getMinutes();

            let [startH, startM] = sessionDataCache.startTime.split(':').map(Number);
            let [endH, endM] = sessionDataCache.endTime.split(':').map(Number);
            let startMinutes = startH * 60 + startM;
            let endMinutes = endH * 60 + endM;

            let btnHadir = document.getElementById('btnAbsenHadir');
            let btnRequest = document.getElementById('btnKirimRequest');
            let alertBox = document.getElementById('sessionClosedAlert');
            let banner = document.getElementById('sessionInfoBanner');

            // AUTO CLOSE: Jika waktu sekarang melebihi jam selesai
            if (!sessionDataCache.isOpen || currentTimeMinutes > endMinutes) {
                alertBox.style.display = 'block';
                alertBox.className = 'session-alert closed';
                alertBox.innerText = "⛔ Sesi absensi hari ini telah ditutup / waktu habis.";
                banner.style.display = 'none';
                btnHadir.disabled = true;
                btnRequest.disabled = true;
                btnHadir.innerText = "Absen Ditutup / Berakhir";
                btnRequest.innerText = "Pengajuan Ditutup";
            } else {
                alertBox.style.display = 'none';
                banner.style.display = 'block';

                if (currentTimeMinutes < startMinutes) {
                    let diff = startMinutes - currentTimeMinutes;
                    let h = Math.floor(diff / 60);
                    let m = diff % 60;
                    banner.innerHTML = `⏳ Sesi belum dimulai. Mulai dalam: <b>${h > 0 ? h + ' jam ' : ''}${m} menit</b> (${sessionDataCache.startTime} - ${sessionDataCache.endTime})`;
                    btnHadir.disabled = true;
                } else {
                    let diff = endMinutes - currentTimeMinutes;
                    let h = Math.floor(diff / 60);
                    let m = diff % 60;
                    banner.innerHTML = `🟢 Sesi Absen Dibuka! Sisa waktu: <b>${h > 0 ? h + ' jam ' : ''}${m} menit</b> (Selesai pukul ${sessionDataCache.endTime})`;
                }
            }
        }

        window.openEditModal = function() {
            document.getElementById('editName').value = loggedInUser.name || loggedInUser.nama || '';
            document.getElementById('editUserId').value = loggedInUser.userId || loggedInUser.nis || loggedInUser.username || '';
            document.getElementById('editPassword').value = loggedInUser.password || '';
            document.getElementById('editPhone').value = loggedInUser.phone || '';
            document.getElementById('editPhotoFile').value = '';
            document.getElementById('editProfileModal').style.display = 'flex';
        };

        window.closeEditModal = function() { document.getElementById('editProfileModal').style.display = 'none'; };

        window.saveProfileChanges = async function() {
            let newPassword = document.getElementById('editPassword').value.trim();
            let newPhone = document.getElementById('editPhone').value.trim();
            let photoInput = document.getElementById('editPhotoFile');

            if (!newPassword) { alert('Password wajib diisi!'); return; }
            loggedInUser.password = newPassword;
            loggedInUser.phone = newPhone || '-';

            async function finalizeUpdate() {
                try {
                    let userId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username;
                    await setDoc(doc(db, "siswa", String(userId)), loggedInUser, { merge: true });
                    localStorage.setItem('loggedInStudent', JSON.stringify(loggedInUser));
                    initStudentData();
                    closeEditModal();
                    alert('Profil berhasil diperbarui!');
                } catch (e) { alert('Gagal menyimpan: ' + e.message); }
            }

            if (photoInput.files && photoInput.files[0]) {
                let reader = new FileReader();
                reader.onload = async function(e) { loggedInUser.photo = e.target.result; await finalizeUpdate(); };
                reader.readAsDataURL(photoInput.files[0]);
            } else { await finalizeUpdate(); }
        };

        async function checkTodayAttendance() {
            let studentId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username;
            try {
                let attRef = doc(db, "attendance", currentDateStr, "records", String(studentId));
                let attSnap = await getDoc(attRef);
                
                let statusValEl = document.getElementById('currentStatusVal');
                let reqInfoEl = document.getElementById('requestStatusInfo');
                let btnHadir = document.getElementById('btnAbsenHadir');
                let btnRequest = document.getElementById('btnKirimRequest');

                if (attSnap.exists()) {
                    let data = attSnap.data();
                    statusValEl.innerText = data.status || (data.requestStatus ? data.requestType : 'Belum Absen');
                    statusValEl.className = `status-val ${data.status || data.requestType || ''}`;

                    if (data.status || data.requestStatus) {
                        btnHadir.disabled = true;
                        btnRequest.disabled = true;
                        if (data.status === 'Hadir') btnHadir.innerText = "Sudah Absen Hadir Hari Ini";
                        else if (data.status === 'Alpha') btnHadir.innerText = "Status: Alpha (Tidak Hadir)";
                        else btnHadir.innerText = "Absen Dikunci";
                    }

                    if (data.requestStatus === 'pending') reqInfoEl.innerHTML = `<span style="color:var(--warning); font-weight:600;">⏳ Pengajuan ${data.requestType} menunggu konfirmasi admin.</span>`;
                    else if (data.requestStatus === 'approved') reqInfoEl.innerHTML = `<span style="color:var(--success); font-weight:600;">✔ Pengajuan ${data.requestType} telah <b>DISETUJUI</b> admin.</span>`;
                    else if (data.requestStatus === 'rejected') reqInfoEl.innerHTML = `<span style="color:var(--danger); font-weight:600;">✖ Pengajuan ${data.requestType} <b>DITOLAK</b> admin.</span>`;
                }
            } catch (e) { console.error("Gagal memeriksa status absen:", e); }
        }

        window.submitHadir = async function() {
            let studentId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username;
            let attRef = doc(db, "attendance", currentDateStr, "records", String(studentId));
            try {
                let now = new Date();
                let timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                await setDoc(attRef, {
                    userId: studentId, name: loggedInUser.name || loggedInUser.nama,
                    status: 'Hadir', absentTime: timeStr, timestamp: new Date()
                }, { merge: true });
                alert('Absen Hadir berhasil dicatat!');
                location.reload();
            } catch (e) { alert('Gagal mengirim absen: ' + e.message); }
        };

        window.submitRequest = async function() {
            let type = document.getElementById('reqType').value;
            let reason = document.getElementById('reqReason').value.trim();
            if (!reason) { alert('Alasan wajib diisi!'); return; }

            let studentId = loggedInUser.userId || loggedInUser.nis || loggedInUser.username;
            let attRef = doc(db, "attendance", currentDateStr, "records", String(studentId));
            try {
                await setDoc(attRef, {
                    userId: studentId, name: loggedInUser.name || loggedInUser.nama,
                    requestStatus: 'pending', requestType: type, reason: reason, timestamp: new Date()
                }, { merge: true });
                alert('Pengajuan berhasil dikirim!');
                location.reload();
            } catch (e) { alert('Gagal mengirim pengajuan: ' + e.message); }
        };
    </script>
</body>
</html>
