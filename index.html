<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Sistem Absensi</title>
    <style>
        :root {
            --primary: #dc2626;         /* Merah Utama */
            --primary-hover: #b91c1c;   /* Merah Gelap saat Hover */
            --primary-light: #fef2f2;   /* Merah Sangat Muda untuk Background Accent */
            --gray-border: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --bg-body: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            background-image: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(220, 38, 38, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04); 
            border: 1px solid rgba(220, 38, 38, 0.1);
        }

        /* Bagian Logo & Header */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-wrapper img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
        }

        h2 { 
            font-size: 1.5rem; 
            color: var(--primary); 
            margin-bottom: 6px; 
            font-weight: 800; 
            text-align: center; 
            letter-spacing: -0.5px;
        }
        
        .subtitle { 
            font-size: 0.88rem; 
            color: var(--text-muted); 
            text-align: center; 
            margin-bottom: 30px; 
        }
        
        .form-group { 
            margin-bottom: 20px; 
        }
        
        .form-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
        }
        
        .form-group input { 
            width: 100%; 
            padding: 13px 16px; 
            border: 1.5px solid var(--gray-border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none; 
            background: #fff; 
            transition: all 0.25s ease; 
        }
        
        .form-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12); 
        }

        .btn { 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 13px; 
            font-size: 1rem; 
            font-weight: 600; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: background-color 0.2s, transform 0.1s; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        
        .btn:hover { 
            background-color: var(--primary-hover); 
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        .info-hint { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            text-align: center; 
            margin-top: 25px; 
            line-height: 1.5; 
            background: var(--primary-light);
            padding: 12px;
            border-radius: 8px;
            border-left: 3.5px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo dan Judul -->
        <div class="logo-wrapper">
            <!-- Pastikan file logo.png berada di satu folder yang sama dengan index.html -->
            <img src="logo.png" alt="Logo Instansi" onerror="this.style.display='none'">
            <h2>Portal Absensi</h2>
            <p class="subtitle">Silakan masukkan Username dan Password Anda</p>
        </div>

        <!-- Form Login Universal -->
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginId" placeholder="Masukkan username...">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan password...">
        </div>
        
        <button class="btn" onclick="handleUniversalLogin()">Login</button>
        
        <div class="info-hint">
            💡 Masukkan password dengan benar
        </div>
    </div>

    <script>
        // Ubah password admin di sini jika ingin diganti
        const ADMIN_PASSWORD_CONFIG = "admin123"; 

        function handleUniversalLogin() {
            let inputId = document.getElementById('loginId').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            if (!inputId || !password) {
                alert('Kolom ID dan Password wajib diisi!');
                return;
            }

            // 1. Cek apakah yang login adalah Admin (berdasarkan password admin)
            if (password === ADMIN_PASSWORD_CONFIG) {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
                return;
            }

            // 2. Jika bukan password admin, cari sebagai Siswa (berdasarkan masterStudentsList)
            let students = JSON.parse(localStorage.getItem('masterStudentsList')) || [];
            
            let student = students.find(s => 
                (s.userId === inputId || s.nis === inputId || s.id == inputId) && s.password === password
            );

            if (!student) {
                alert('ID atau Password salah!');
                return;
            }

            // Simpan sesi data siswa
            let sessionData = {
                id: student.id || Date.now(),
                userId: student.userId || student.nis || inputId,
                name: student.name || student.nama || 'Siswa',
                school: student.school || '-',
                phone: student.phone || '-',
                photo: student.photo || ''
            };

            localStorage.setItem('loggedInStudent', JSON.stringify(sessionData));
            window.location.href = 'siswa.html';
        }
    </script>
</body>
</html>
